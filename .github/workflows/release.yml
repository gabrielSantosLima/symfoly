name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored when an explicit version is provided)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - premajor
          - preminor
          - prepatch
      preid:
        description: "Pre-release identifier (used by pre* bumps), for example alpha"
        required: false
        default: alpha
        type: string
      version:
        description: "Explicit version (optional; overrides the bump type)"
        required: false
        default: ""
        type: string
      summary:
        description: "Short release summary (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  quality:
    name: Quality
    uses: ./.github/workflows/ci.yml

  release:
    name: Release

    needs: quality

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          VERSION_INPUT: ${{ inputs.version }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |

          if [ -n "$VERSION_INPUT" ]; then
            VERSION=$(node scripts/bump-version.mjs --version "$VERSION_INPUT")
          else
            VERSION=$(node scripts/bump-version.mjs --bump "$BUMP" --preid "$PREID")
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          SUMMARY: ${{ inputs.summary }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.mjs \
            --from "${{ steps.prev.outputs.tag }}" \
            --to HEAD \
            --version "$VERSION" \
            --out NOTES.md

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file NOTES.md \
            $PRERELEASE

  build:
    name: Build
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: v${{ needs.release.outputs.version }}

