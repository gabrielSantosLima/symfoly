<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Symfoly">
  <!-- Favicon tile — indigo background with a white simplified mark.
       Palette: tile #4F46E5, mark #FFFFFF. Simplest form for 16–64 px. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#4F46E5" />
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <path d="M32 32 32 15" />
    <path d="M32 32 18 40" />
    <path d="M32 32 46 40" />
  </g>
  <circle cx="32" cy="15" r="4.5" fill="#FFFFFF" />
  <circle cx="18" cy="40" r="4.5" fill="#FFFFFF" />
  <circle cx="46" cy="40" r="4.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="7" fill="#FFFFFF" />
</svg>
