extends: ./electron-builder.yml
appId: com.gabrielsantoslima.symfoly.beta
productName: Symfoly Beta

directories:
  output: release-beta

extraMetadata:
  channel: beta

win:
  icon: resources/icon-beta.ico

linux:
  icon: resources/icon-beta.png

extraResources:
  - from: resources/icon-beta.png
    to: icon-beta.png
  - from: resources/icon-beta.ico
    to: icon-beta.ico
  - from: resources/mcp.mjs
    to: mcp.mjs
  - from: resources/symfoly.mjs
    to: symfoly.mjs
  - from: agent-skills
    to: agent-skills
