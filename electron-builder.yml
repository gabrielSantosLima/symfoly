appId: com.gabrielsantoslima.symfoly
productName: Symfoly

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Utility
