appId: com.gabrielsantoslima.symfoly
productName: Symfoly

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/mcp.mjs
    to: mcp.mjs
  - from: resources/symfoly.mjs
    to: symfoly.mjs
  - from: agent-skills
    to: agent-skills

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Utility
